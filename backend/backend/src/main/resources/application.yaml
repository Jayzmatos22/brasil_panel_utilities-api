spring:
  profiles:
    active: dev

  security:
    filter:
      order: 10

  mvc:
    async:
      request-timeout: 15000

server:
  port: 8080

# ── JWT ──────────────────────────────────────────────────────────────────────
# Em produção, sobrescreva via variável de ambiente: JWT_SECRET=<sua-chave-256-bits>
jwt:
  # Sem valor padrão de propósito: a aplicação não sobe sem JWT_SECRET definido.
  # Um default versionado seria uma chave pública — qualquer um forjaria tokens de ADMIN.
  # Mínimo de 32 bytes (HS256). O perfil dev define o seu em application-dev.yml.
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24 h

# ── CORS ─────────────────────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # ── Admin seed ─────────────────────────────────────────────────────────────
  # Credenciais definidas em application-local.yaml (gitignored) ou via env vars:
  #   ADMIN_EMAIL    — e-mail do admin
  #   ADMIN_PASSWORD — senha do admin (mín. 8 caracteres); se vazio, admin não é criado
  admin:
    email:    ${ADMIN_EMAIL:admin@brasilpanel.com}
    password: ${ADMIN_PASSWORD:}

  # ── Cookie de sessão ───────────────────────────────────────────────────────
  # secure=true exige HTTPS. Deve ser true em produção e false em dev (localhost).
  auth:
    cookie:
      secure: ${COOKIE_SECURE:false}

  # ── Cache (Caffeine) ───────────────────────────────────────────────────────
  # Janelas de expiração por cadência da fonte de dados. Os defaults ficam em
  # CacheTtlProperties; descomente aqui (ou no yml do perfil) para sobrescrever.
  # cache:
  #   ttl:
  #     static-data: 7d    # malha territorial do IBGE
  #     daily:       24h   # IPEA, World Bank, SIDRA, ViaCEP
  #     half-day:    12h   # fixing LBMA, metais, lista de bancos
  #     hourly:      60m   # indicadores do BCB e câmbio
  #     intraday:    15m   # ações (cota da AlphaVantage)
  #     realtime:    5m    # cripto (free tier do CoinGecko)

  # Remetente dos e-mails — sobrescrito em application-dev.yml / env vars
  mail:
    from-address: ${MAIL_FROM_ADDRESS:onboarding@resend.dev}
    from-name:    ${MAIL_FROM_NAME:Brasil Panel}

# ── Springdoc — desabilitado por padrão; ativado apenas no perfil dev ────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false