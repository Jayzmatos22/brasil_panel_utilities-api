spring:
  profiles:
    active: dev

  security:
    filter:
      order: 10

  mvc:
    async:
      request-timeout: 15000

  # ── Flyway ─────────────────────────────────────────────────────────────────
  # O schema é versionado em db/migration e o Hibernate nunca mais o altera
  # (dev e prod usam ddl-auto: validate). Alterar entidade sem migration
  # correspondente passa a quebrar o boot, que é o comportamento desejado:
  # antes, o desencontro só aparecia em produção, no deploy.
  #
  # baseline-on-migrate existe porque dev e produção JÁ têm as tabelas, criadas
  # pelo ddl-auto: update de antes. Nesses bancos o Flyway apenas registra a V1
  # como aplicada, sem executá-la. Em banco vazio, a V1 roda normalmente.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "baseline do schema pre-Flyway"

server:
  # ${PORT:8080} e não 8080 fixo: o Render injeta PORT e faz o health check
  # contra ela. Com a porta fixa o serviço sobe, o Render não encontra nada
  # escutando onde espera, e o deploy falha por health check — sem nenhum erro
  # nos logs da aplicação, que é o que torna o diagnóstico demorado.
  # Fora do Render a variável não existe e o default de 8080 vale.
  port: ${PORT:8080}

# ── Actuator ─────────────────────────────────────────────────────────────────
# Só o health é exposto. Os demais endpoints (env, beans, mappings, heapdump)
# revelam configuração interna e não devem ficar acessíveis publicamente.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ── JWT ──────────────────────────────────────────────────────────────────────
# Em produção, sobrescreva via variável de ambiente: JWT_SECRET=<sua-chave-256-bits>
jwt:
  # Sem valor padrão de propósito: a aplicação não sobe sem JWT_SECRET definido.
  # Um default versionado seria uma chave pública — qualquer um forjaria tokens de ADMIN.
  # Mínimo de 32 bytes (HS256). O perfil dev define o seu em application-dev.yml.
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24 h

# ── CoinMarketCap ────────────────────────────────────────────────────────────
# Plano Basic: 15.000 créditos/mês, 50 req/min, 1 conversão de moeda por chamada.
# Sem CMC_API_KEY a fonte fica desligada e o painel roda só com o CoinGecko —
# de propósito, para a aplicação subir em ambientes que ainda não têm a chave.
coinmarketcap:
  api-key: ${CMC_API_KEY:}
  # Top 100 cabe em 1 crédito (cobrança: 1 crédito por 200 data points).
  listing-limit: 100

# ── CORS ─────────────────────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # ── Admin seed ─────────────────────────────────────────────────────────────
  # Credenciais definidas em application-local.yaml (gitignored) ou via env vars:
  #   ADMIN_EMAIL    — e-mail do admin
  #   ADMIN_PASSWORD — senha do admin (mín. 8 caracteres); se vazio, admin não é criado
  admin:
    email:    ${ADMIN_EMAIL:admin@brasilpanel.com}
    password: ${ADMIN_PASSWORD:}

  # ── Rate limit ─────────────────────────────────────────────────────────────
  # Teto por IP nas rotas /api/**, em janela de 1 minuto. Existe porque essas
  # rotas são públicas e várias consomem cota de API externa paga: sem teto, um
  # laço trivial esgota o orçamento do mês.
  # 120/min é folgado para uso real (uma tela do painel dispara dezenas de
  # chamadas) e ainda assim contém abuso sustentado.
  #
  # As rotas que disparam e-mail (/api/auth/register e /api/auth/resend-code) têm
  # teto próprio, muito mais apertado: cadastrar-se é ação rara, e 120/min ali
  # significaria 120 mensagens por minuto para endereços de terceiros.
  # O teto global existe porque o X-Forwarded-For é forjável nesta topologia
  # (ver RateLimitFilter#clientId) — é o piso que não depende de identidade.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:120}
    emails-per-hour: ${RATE_LIMIT_EMAILS_PER_HOUR:5}
    # Janela DIÁRIA, não horária: é assim que a cota do provedor é expressa. O plano
    # gratuito do Resend permite 3.000 e-mails/mês com teto de 100/DIA, e é o diário
    # que morde primeiro. O valor anterior (60/hora) admitia 1.440/dia — 14x o teto
    # do provedor, ou seja, um pico estouraria a cota e os envios passariam a ser
    # recusados. 80/dia deixa margem e segue ordens de grandeza acima do uso real.
    emails-per-day-global: ${RATE_LIMIT_EMAILS_GLOBAL:80}

  # ── Cookie de sessão ───────────────────────────────────────────────────────
  # secure=true exige HTTPS. Deve ser true em produção e false em dev (localhost).
  auth:
    cookie:
      secure: ${COOKIE_SECURE:false}

  # ── Retenção de snapshots ──────────────────────────────────────────────────
  # Só as tabelas de cripto crescem rápido o bastante para precisar de expurgo
  # (~24 mil linhas/dia somando as duas fontes). O painel não exibe histórico de
  # cripto: a janela existe para diagnóstico, não para consulta.
  # O batch mais recente nunca é apagado, mesmo fora da janela.
  snapshot:
    retention:
      crypto-days: ${SNAPSHOT_RETENTION_DAYS:7}

  # ── Cache (Caffeine) ───────────────────────────────────────────────────────
  # Janelas de expiração por cadência da fonte de dados. Os defaults ficam em
  # CacheTtlProperties; descomente aqui (ou no yml do perfil) para sobrescrever.
  # cache:
  #   ttl:
  #     static-data: 7d    # malha territorial do IBGE
  #     daily:       24h   # IPEA, World Bank, SIDRA, ViaCEP
  #     half-day:    12h   # fixing LBMA, metais, lista de bancos
  #     hourly:      60m   # indicadores do BCB e câmbio
  #     intraday:    15m   # ações (cota da AlphaVantage)
  #     realtime:    5m    # cripto (free tier do CoinGecko)

  # Remetente dos e-mails — sobrescrito em application-dev.yml / env vars
  mail:
    # ATENÇÃO: o default é o remetente de sandbox do Resend, que só entrega para o
    # e-mail da própria conta. Em produção, com ele, nenhum usuário real recebe o
    # código. Defina MAIL_FROM_ADDRESS com um endereço do domínio verificado.
    from-address: ${MAIL_FROM_ADDRESS:onboarding@resend.dev}
    from-name:    ${MAIL_FROM_NAME:Brasil Panel}

    # ── Fila de envio (outbox) ─────────────────────────────────────────────
    # O envio sai da thread da requisição e passa por uma tabela, drenada pelo
    # EmailOutboxScheduler. Ver V4__email_outbox.sql para o porquê.
    outbox:
      drain-interval-ms: ${MAIL_OUTBOX_DRAIN_MS:10000}
      max-attempts:      ${MAIL_OUTBOX_MAX_ATTEMPTS:5}
      retry-backoff:     ${MAIL_OUTBOX_BACKOFF:PT1M}
      retention:
        sent-days:   ${MAIL_OUTBOX_RETENTION_SENT:3}
        failed-days: ${MAIL_OUTBOX_RETENTION_FAILED:30}

# ── Springdoc — desabilitado por padrão; ativado apenas no perfil dev ────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false