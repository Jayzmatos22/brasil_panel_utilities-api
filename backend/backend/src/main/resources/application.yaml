spring:
  profiles:
    active: dev

  security:
    filter:
      order: 10

  mvc:
    async:
      request-timeout: 15000

  # ── Flyway ─────────────────────────────────────────────────────────────────
  # O schema é versionado em db/migration e o Hibernate nunca mais o altera
  # (dev e prod usam ddl-auto: validate). Alterar entidade sem migration
  # correspondente passa a quebrar o boot, que é o comportamento desejado:
  # antes, o desencontro só aparecia em produção, no deploy.
  #
  # baseline-on-migrate existe porque dev e produção JÁ têm as tabelas, criadas
  # pelo ddl-auto: update de antes. Nesses bancos o Flyway apenas registra a V1
  # como aplicada, sem executá-la. Em banco vazio, a V1 roda normalmente.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "baseline do schema pre-Flyway"

server:
  port: 8080

# ── Actuator ─────────────────────────────────────────────────────────────────
# Só o health é exposto. Os demais endpoints (env, beans, mappings, heapdump)
# revelam configuração interna e não devem ficar acessíveis publicamente.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ── JWT ──────────────────────────────────────────────────────────────────────
# Em produção, sobrescreva via variável de ambiente: JWT_SECRET=<sua-chave-256-bits>
jwt:
  # Sem valor padrão de propósito: a aplicação não sobe sem JWT_SECRET definido.
  # Um default versionado seria uma chave pública — qualquer um forjaria tokens de ADMIN.
  # Mínimo de 32 bytes (HS256). O perfil dev define o seu em application-dev.yml.
  secret: ${JWT_SECRET}
  expiration-ms: 86400000  # 24 h

# ── CoinMarketCap ────────────────────────────────────────────────────────────
# Plano Basic: 15.000 créditos/mês, 50 req/min, 1 conversão de moeda por chamada.
# Sem CMC_API_KEY a fonte fica desligada e o painel roda só com o CoinGecko —
# de propósito, para a aplicação subir em ambientes que ainda não têm a chave.
coinmarketcap:
  api-key: ${CMC_API_KEY:}
  # Top 100 cabe em 1 crédito (cobrança: 1 crédito por 200 data points).
  listing-limit: 100

# ── CORS ─────────────────────────────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # ── Admin seed ─────────────────────────────────────────────────────────────
  # Credenciais definidas em application-local.yaml (gitignored) ou via env vars:
  #   ADMIN_EMAIL    — e-mail do admin
  #   ADMIN_PASSWORD — senha do admin (mín. 8 caracteres); se vazio, admin não é criado
  admin:
    email:    ${ADMIN_EMAIL:admin@brasilpanel.com}
    password: ${ADMIN_PASSWORD:}

  # ── Cookie de sessão ───────────────────────────────────────────────────────
  # secure=true exige HTTPS. Deve ser true em produção e false em dev (localhost).
  auth:
    cookie:
      secure: ${COOKIE_SECURE:false}

  # ── Retenção de snapshots ──────────────────────────────────────────────────
  # Só as tabelas de cripto crescem rápido o bastante para precisar de expurgo
  # (~24 mil linhas/dia somando as duas fontes). O painel não exibe histórico de
  # cripto: a janela existe para diagnóstico, não para consulta.
  # O batch mais recente nunca é apagado, mesmo fora da janela.
  snapshot:
    retention:
      crypto-days: ${SNAPSHOT_RETENTION_DAYS:7}

  # ── Cache (Caffeine) ───────────────────────────────────────────────────────
  # Janelas de expiração por cadência da fonte de dados. Os defaults ficam em
  # CacheTtlProperties; descomente aqui (ou no yml do perfil) para sobrescrever.
  # cache:
  #   ttl:
  #     static-data: 7d    # malha territorial do IBGE
  #     daily:       24h   # IPEA, World Bank, SIDRA, ViaCEP
  #     half-day:    12h   # fixing LBMA, metais, lista de bancos
  #     hourly:      60m   # indicadores do BCB e câmbio
  #     intraday:    15m   # ações (cota da AlphaVantage)
  #     realtime:    5m    # cripto (free tier do CoinGecko)

  # Remetente dos e-mails — sobrescrito em application-dev.yml / env vars
  mail:
    from-address: ${MAIL_FROM_ADDRESS:onboarding@resend.dev}
    from-name:    ${MAIL_FROM_NAME:Brasil Panel}

# ── Springdoc — desabilitado por padrão; ativado apenas no perfil dev ────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false