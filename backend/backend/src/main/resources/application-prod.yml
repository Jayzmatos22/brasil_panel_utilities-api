
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      # validate (nunca update) em produção: o Hibernate não deve alterar o schema
      # sozinho a cada deploy. Requer que o schema já exista e corresponda às entidades.
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  cache:
    type: caffeine

alpha-vantage:
  keys: ${ALPHA_KEYS}

metals:
  api-key: ${METALS_KEY}