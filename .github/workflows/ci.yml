name: CI backend brasil_panel

# run
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
jobs:
  # ==========================================
  # 1. CI DO BACKEND (JAVA / SPRING BOOT)
  # ==========================================
  backend-ci:
    name: Backend CI (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/backend

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      # 1. INSTALL & BUILD
      - name: Compilar Java (Install & Build)
        run: mvn clean compile

      # 2. TEST — roda no perfil `test`, com H2 em memória.
      # Não requer PostgreSQL nem acesso de rede.
      #
      # `verify` e não `test`: é a fase em que o JaCoCo gera o relatório e aplica
      # a catraca de cobertura. Com `mvn test` o plugin instrumentaria o bytecode
      # e ninguém olharia o resultado.
      - name: Executar Testes e Cobertura
        run: mvn verify

      # O relatório fica disponível mesmo quando o build reprova — que é
      # justamente quando alguém precisa dele para saber o que descobrir.
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/backend/target/site/jacoco/
          retention-days: 7

      # 3. PACKAGE
      - name: Empacotar Aplicação (.jar)
        run: mvn package -DskipTests

    # ==========================================
    # 2. CI DO FRONTEND (REACT + TYPESCRIPT)
    # ==========================================
  frontend-ci:
    name: Frontend CI (React TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # 1. INSTALL
      - name: Instalar Dependências (npm ci)
        run: npm ci

      # 2. LINT
      - name: Verificar Lint (ESLint + React Hooks)
        run: npm run lint

      # 3. TEST (Vitest + Testing Library, ambiente jsdom)
      - name: Executar Testes
        run: npm test

      # 4. BUILD (inclui type-check via tsc -b)
      - name: Build do Frontend (Vite + TS Check)
        run: npm run build
