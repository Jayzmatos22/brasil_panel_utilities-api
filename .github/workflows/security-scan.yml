name: Varredura de dependências

# Duas verificações com propósitos diferentes:
#
#   dependency-review  — só em PR, e REPROVA. Olha apenas o que a PR ACRESCENTA,
#                        então não pode falhar por dívida preexistente. É a trava
#                        que impede o problema novo de entrar.
#
#   trivy              — inventário completo, e NÃO reprova (ver o comentário no
#                        job). Serve para enxergar e triar o que já está aqui.
#
# Por que em workflow separado do ci.yml: o deploy do Render é liberado pela CI.
# Uma varredura que reprovasse por uma CVE publicada numa terça-feira pararia os
# deploys sem que ninguém tivesse mudado uma linha de código.
on:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]
  schedule:
    # Segunda de manhã (UTC). Dependência não muda sozinha, mas o que se sabe
    # sobre ela muda: a varredura agendada é o que pega CVE publicada depois
    # do último commit.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. O QUE A PR ACRESCENTA (reprova)
  # ==========================================
  dependency-review:
    name: Revisão de dependências (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      # Compara a base com a head e falha se a PR INTRODUZIR dependência com
      # vulnerabilidade conhecida de severidade alta ou crítica. Dívida que já
      # existia na base não entra na conta — é isso que torna seguro reprovar
      # desde o primeiro dia.
      # continue-on-error NO PASSO enquanto o Dependency graph estiver desligado:
      # sem ele a action responde "not supported on this repository" e a
      # verificação fica vermelha para sempre, sem nunca ter olhado nada.
      # Depois de ligar em Settings > Code security, remover esta linha para a
      # verificação voltar a reprovar de verdade.
      - name: Revisar dependências adicionadas
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ==========================================
  # 2. INVENTÁRIO COMPLETO (não reprova ainda)
  # ==========================================
  trivy:
    name: Inventário de vulnerabilidades
    runs-on: ubuntu-latest
    # Blindagem no nível do job: uma falha DENTRO dos passos (base de CVEs fora
    # do ar, timeout de rede, achado) não marca esta verificação como reprovada.
    # Não cobre falha na RESOLUÇÃO das actions, que acontece antes de o job
    # começar — por isso a versão abaixo é uma tag verificada, não um palpite.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      # SBOM gerado pelo próprio Maven, e não varredura do jar.
      #
      # A primeira versão empacotava o jar e mandava o Trivy varrer target/. O
      # jar era produzido (69 MB), o Trivy rodava sem erro e relatava
      # "Number of language-specific files num=0": varria e não reconhecia uma
      # única dependência Java. Uma varredura que não vê nada e passa é pior do
      # que não ter varredura, porque parece cobertura.
      #
      # O SBOM tira a adivinhação do caminho: quem resolve a árvore é o Maven,
      # que é a autoridade sobre ela, e o Trivy só compara os identificadores de
      # pacote com os avisos. De quebra dispensa empacotar — são segundos em vez
      # de construir um jar inteiro.
      - name: Gerar SBOM do backend
        working-directory: ./backend/backend
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=bom

      # Guarda contra a falha silenciosa que aconteceu aqui: se o SBOM vier sem
      # componente, algo quebrou na geração e a varredura seguinte não teria o
      # que olhar. Melhor gritar do que relatar "nenhuma vulnerabilidade".
      - name: Conferir que o SBOM não está vazio
        run: |
          total=$(python3 -c "import json;print(len(json.load(open('backend/backend/target/bom.json')).get('components',[])))")
          echo "Componentes no SBOM: $total"
          if [ "$total" -lt 50 ]; then
            echo "::error::SBOM com $total componentes — esperado bem mais. A varredura não teria o que analisar."
            exit 1
          fi

      - name: Escanear o backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: backend/backend/target/bom.json
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          # Não derruba o passo: o objetivo aqui é enxergar, não barrar.
          exit-code: '0'

      - name: Escanear o frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      # O resultado vai para a aba Security do repositório, que é onde dá para
      # triar item a item, marcar falso positivo e acompanhar o que sobrou.
      # Um log de job não serve para isso: some na próxima execução.
      - name: Publicar resultado do backend
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Publicar resultado do frontend
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # Cópia bruta para quem quiser ler sem abrir a aba Security.
      - name: Guardar relatórios
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy-*.sarif
          retention-days: 14
