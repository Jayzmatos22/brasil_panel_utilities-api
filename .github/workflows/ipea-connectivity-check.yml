name: IPEA connectivity check

on:
  workflow_dispatch:

jobs:
  check:
    name: Alcanca o ipeadata a partir do runner?
    runs-on: ubuntu-latest
    steps:
      - name: Onde esta o runner
        run: curl -s --max-time 10 https://ipinfo.io/json || true
      - name: www.ipeadata.gov.br (host oficial)
        run: |
          echo "== www =="
          curl -sS --max-time 25 -o /dev/null -w "HTTP %{http_code} | tempo %{time_total}s\n" \
            "http://www.ipeadata.gov.br/api/odata4/Metadados('PNADS_GINI')/Valores" \
            || echo "FALHOU (www)"
      - name: apex ipeadata.gov.br
        run: |
          echo "== apex =="
          curl -sS --max-time 25 -o /dev/null -w "HTTP %{http_code} | tempo %{time_total}s\n" \
            "http://ipeadata.gov.br/api/odata4/Metadados('PNADS_GINI')/Valores" \
            || echo "FALHOU (apex)"
